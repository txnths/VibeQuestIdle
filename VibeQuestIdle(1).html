<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeQuestIdle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --bg-deep:#160c22;
  --bg-panel:#241533;
  --bg-panel-2:#2d1c40;
  --border:#4a2f6b;
  --border-lit:#7c4fb8;
  --gold:#e8b64a;
  --gold-dim:#a17e33;
  --parchment:#efe3c8;
  --muted:#a394bd;
  --hp:#e0524a;
  --mp:#4aa8e8;
  --stam:#57c97b;
  --thirst:#4ac9e0;
  --hunger:#d98f3f;
  --mood:#e07ad6;
  --c-common:#b9b3c4;
  --c-uncommon:#5fd06a;
  --c-rare:#4aa8e8;
  --c-epic:#b355e8;
  --c-legendary:#e8a83c;
  --c-mythic:#e85a5a;
  --font-head:'Press Start 2P', monospace;
  --font-body:'VT323', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 10%, #2b1a42 0%, transparent 45%),
    radial-gradient(circle at 85% 90%, #1e2a42 0%, transparent 40%),
    var(--bg-deep);
  color:var(--parchment);
  font-family:var(--font-body);
  font-size:19px;
  min-height:100vh;
  image-rendering:pixelated;
}

::selection{background:var(--gold);color:#241533;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-panel);}
::-webkit-scrollbar-thumb{background:var(--border-lit);border:2px solid var(--bg-panel);}

.pixel-border{
  border:3px solid var(--border);
  box-shadow: inset 0 0 0 2px #0000004d, 0 3px 0 #00000055;
  border-radius:2px;
}

button{
  font-family:var(--font-body);
  font-size:18px;
  cursor:pointer;
  background:var(--bg-panel-2);
  color:var(--parchment);
  border:2px solid var(--border-lit);
  padding:8px 14px;
  border-radius:2px;
  box-shadow: 0 2px 0 #00000066;
  transition:transform .06s ease, background .15s ease;
}
button:hover:not(:disabled){background:#3a2452;}
button:active:not(:disabled){transform:translateY(2px);box-shadow:none;}
button:disabled{opacity:.4;cursor:not-allowed;}
button.primary{background:var(--gold);color:#2a1a10;border-color:var(--gold-dim);font-weight:bold;}
button.primary:hover:not(:disabled){background:#f5c765;}
button.danger{border-color:var(--hp);}

h1,h2,h3,.pixel-title{font-family:var(--font-head);}

#app{display:none;min-height:100vh;flex-direction:column;}
#app.ready{display:flex;}

/* ---------- TOP HUD ---------- */
#hud{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px 18px;
  padding:10px 16px;
  background:linear-gradient(180deg,#2d1c40,#20132e);
  border-bottom:3px solid var(--border-lit);
  position:sticky;top:0;z-index:50;
}
#hud .brand{font-family:var(--font-head);font-size:15px;color:var(--gold);letter-spacing:1px;margin-right:8px;white-space:nowrap;}
#hud .hud-group{display:flex;align-items:center;gap:6px;}
.bar-wrap{display:flex;flex-direction:column;gap:2px;min-width:104px;}
.bar-label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;}
.bar-track{width:100%;height:11px;background:#140b1e;border:2px solid #000;border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;transition:width .3s ease;}
.fill-hp{background:linear-gradient(90deg,#a83c34,var(--hp));}
.fill-mp{background:linear-gradient(90deg,#2f6fa8,var(--mp));}
.fill-xp{background:linear-gradient(90deg,#a1802f,var(--gold));}
.fill-stam{background:linear-gradient(90deg,#2f8a53,var(--stam));}
.fill-thirst{background:linear-gradient(90deg,#2f8fa0,var(--thirst));}
.fill-hunger{background:linear-gradient(90deg,#a06426,var(--hunger));}
.fill-mood{background:linear-gradient(90deg,#a04d94,var(--mood));}
.fill-fatigue{background:linear-gradient(90deg,#8a3c3c,#e08a4a);}

.hud-chip{
  font-size:14px;background:#1a1026;border:1px solid var(--border);
  padding:4px 8px;border-radius:2px;color:var(--muted);white-space:nowrap;
}
.hud-chip b{color:var(--parchment);}
#goldChip{color:var(--gold);border-color:var(--gold-dim);}
#goldChip b{color:var(--gold);}

/* ---------- LAYOUT ---------- */
#main{display:flex;flex:1;min-height:0;}
#tabrail{
  width:168px;flex-shrink:0;
  background:#1c1128;
  border-right:3px solid var(--border-lit);
  display:flex;flex-direction:column;
  padding:10px 0;
  overflow-y:auto;
}
.tab-btn{
  background:none;border:none;box-shadow:none;
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;text-align:left;
  color:var(--muted);font-size:16px;
  border-left:4px solid transparent;
  border-radius:0;width:100%;
}
.tab-btn:hover{background:#2a1a3d;color:var(--parchment);}
.tab-btn.active{background:#33204a;color:var(--gold);border-left-color:var(--gold);}
.tab-icon{font-size:18px;width:22px;text-align:center;}

#content{flex:1;overflow-y:auto;padding:20px 22px 60px;min-width:0;}
.panel{display:none;}
.panel.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.section-title{font-family:var(--font-head);font-size:16px;color:var(--gold);margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--border);}
.sub-title{font-family:var(--font-head);font-size:12px;color:var(--parchment);margin:18px 0 10px;}

.card{background:var(--bg-panel);border:2px solid var(--border);border-radius:3px;padding:14px;margin-bottom:12px;}
.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}

.tag{display:inline-block;font-size:13px;padding:2px 7px;border-radius:2px;border:1px solid;margin-right:4px;}
.stat-row{display:flex;justify-content:space-between;font-size:16px;padding:2px 0;color:var(--muted);}
.stat-row b{color:var(--parchment);}

/* rarity coloring */
.r-common{color:var(--c-common);border-color:var(--c-common);}
.r-uncommon{color:var(--c-uncommon);border-color:var(--c-uncommon);}
.r-rare{color:var(--c-rare);border-color:var(--c-rare);}
.r-epic{color:var(--c-epic);border-color:var(--c-epic);}
.r-legendary{color:var(--c-legendary);border-color:var(--c-legendary);}
.r-mythic{color:var(--c-mythic);border-color:var(--c-mythic);}

/* selectable choice cards (char creation) */
.choice-card{
  background:var(--bg-panel);border:2px solid var(--border);border-radius:3px;
  padding:12px;cursor:pointer;transition:border-color .15s, transform .1s;
}
.choice-card:hover{border-color:var(--border-lit);transform:translateY(-2px);}
.choice-card.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
.choice-icon{font-size:28px;}
.choice-name{font-family:var(--font-head);font-size:13px;color:var(--gold);margin:8px 0 4px;}
.choice-desc{font-size:15px;color:var(--muted);line-height:1.35;}

/* paperdoll */
#paperdoll{display:grid;grid-template-columns:repeat(3,84px);gap:8px;justify-content:center;}
.doll-slot{
  width:84px;height:84px;background:#160c22;border:2px dashed var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;text-align:center;color:var(--muted);border-radius:3px;cursor:pointer;padding:4px;
}
.doll-slot.filled{border-style:solid;}
.doll-slot .slot-icon{font-size:22px;}

.item-row{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:3px;margin-bottom:6px;background:#1c1128;}
.item-row .slot-icon{font-size:20px;width:26px;text-align:center;}
.item-info{flex:1;min-width:0;}
.item-name{font-size:16px;}
.item-sub{font-size:13px;color:var(--muted);}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;}
.item-actions button{padding:4px 8px;font-size:13px;}

progress.skillbar{-webkit-appearance:none;appearance:none;width:100%;height:8px;}
.skill-card{background:#1c1128;border:1px solid var(--border);border-radius:3px;padding:10px;}
.skill-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.skill-name{font-size:16px;color:var(--parchment);}
.skill-lvl{font-size:13px;color:var(--gold);}
.skill-desc{font-size:14px;color:var(--muted);margin:4px 0 8px;}
.skill-dots{display:flex;gap:3px;margin-bottom:8px;}
.dot{width:11px;height:11px;border-radius:50%;background:#3a2452;border:1px solid var(--border);}
.dot.lit{background:var(--gold);}

.progress-outer{width:100%;height:14px;background:#140b1e;border:2px solid #000;border-radius:2px;overflow:hidden;}
.progress-inner{height:100%;background:linear-gradient(90deg,#a1802f,var(--gold));transition:width .2s;}

#battleLog{
  height:170px;overflow-y:auto;background:#0f0917;border:2px solid var(--border);
  border-radius:3px;padding:8px 10px;font-size:15px;display:flex;flex-direction:column-reverse;
}
#battleLog div{padding:2px 0;border-bottom:1px dotted #2a1c3d;}
.log-dmg{color:#ff9d8a;}
.log-crit{color:var(--c-legendary);}
.log-loot{color:var(--c-uncommon);}
.log-lvl{color:var(--gold);}
.log-info{color:var(--muted);}

.monster-badge{display:flex;align-items:center;gap:14px;background:var(--bg-panel);border:2px solid var(--border);padding:12px;border-radius:3px;}
.monster-icon{font-size:38px;}

#modalOverlay{position:fixed;inset:0;background:#0a0612e6;display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
#modalOverlay.show{display:flex;}
#modalBox{background:var(--bg-panel);border:3px solid var(--gold);border-radius:4px;max-width:640px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;}

.banner{padding:10px 14px;border-radius:3px;margin-bottom:14px;font-size:15px;}
.banner.warn{background:#3d1f1f;border:2px solid var(--hp);color:#ffc7c0;}
.banner.info{background:#1f2e3d;border:2px solid var(--mp);color:#c7e3ff;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
select{font-family:var(--font-body);font-size:16px;background:#1a1026;color:var(--parchment);border:2px solid var(--border);padding:6px 8px;border-radius:2px;}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);}

@media (max-width:820px){
  #tabrail{width:56px;}
  .tab-btn span.label{display:none;}
  #paperdoll{grid-template-columns:repeat(3,70px);}
  .doll-slot{width:70px;height:70px;}
}
</style>
</head>
<body>

<div id="charCreate" class="pixel-border" style="max-width:920px;margin:26px auto;padding:26px;background:var(--bg-panel);">
  <div style="text-align:center;margin-bottom:6px;">
    <div style="font-family:var(--font-head);font-size:26px;color:var(--gold);text-shadow:3px 3px 0 #000;">VibeQuestIdle</div>
    <div style="color:var(--muted);margin-top:6px;font-size:17px;">a high fantasy pixel idle rpg</div>
  </div>
  <div id="ccStep1">
    <h3 class="sub-title">Choose your race</h3>
    <div id="raceChoices" class="grid grid-4"></div>
  </div>
  <div id="ccStep2" style="margin-top:8px;">
    <h3 class="sub-title">Choose your class</h3>
    <div id="classChoices" class="grid grid-4"></div>
  </div>
  <div style="margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <input id="heroName" placeholder="Name your hero" maxlength="18" style="font-family:var(--font-body);font-size:17px;background:#1a1026;color:var(--parchment);border:2px solid var(--border);padding:8px 10px;border-radius:2px;flex:1;min-width:180px;">
    <button class="primary" id="beginBtn" disabled>Begin adventure</button>
  </div>
  <div id="ccSummary" style="margin-top:12px;font-size:15px;color:var(--muted);"></div>
</div>

<div id="app">
  <div id="hud"></div>
  <div id="main">
    <div id="tabrail"></div>
    <div id="content"></div>
  </div>
</div>

<div id="modalOverlay"><div id="modalBox"></div></div>

<script>
/* =========================================================
   VibeQuestIdle - core data & engine
   ========================================================= */
(function(){
"use strict";

/* ---------------- STATS & ELEMENTS ---------------- */
const STAT_KEYS = ['str','agi','int','vit','wis','luck'];
const STAT_LABEL = {str:'Strength',agi:'Agility',int:'Intellect',vit:'Vitality',wis:'Wisdom',luck:'Luck'};

const ELEMENTS = [
  {key:'fire',name:'Fire',icon:'🔥',color:'#ff5a3c'},
  {key:'water',name:'Water',icon:'🌊',color:'#3ca6ff'},
  {key:'earth',name:'Earth',icon:'⛰️',color:'#a9793f'},
  {key:'air',name:'Air',icon:'🌪️',color:'#bfe8ff'},
  {key:'ice',name:'Ice',icon:'❄️',color:'#8fdcff'},
  {key:'lightning',name:'Lightning',icon:'⚡',color:'#ffe94a'},
  {key:'nature',name:'Nature',icon:'🌿',color:'#5ad66a'},
  {key:'shadow',name:'Shadow',icon:'🌑',color:'#9a6ae8'},
  {key:'light',name:'Light',icon:'✨',color:'#fff2b0'},
  {key:'arcane',name:'Arcane',icon:'🔮',color:'#c15aff'},
  {key:'metal',name:'Metal',icon:'⚙️',color:'#c9c9d6'},
  {key:'void',name:'Void',icon:'🕳️',color:'#8a6ae8'},
];
const EL = {}; ELEMENTS.forEach(e=>EL[e.key]=e);

const RANK_TITLES = ['Initiate','Associate','Trusted','Veteran','Elite','Champion','Hero','Legend','Icon','Grandmaster'];

const RARITY = [
  {key:'common',name:'Common',weight:50,mult:1,color:'var(--c-common)'},
  {key:'uncommon',name:'Uncommon',weight:26,mult:1.6,color:'var(--c-uncommon)'},
  {key:'rare',name:'Rare',weight:13,mult:2.4,color:'var(--c-rare)'},
  {key:'epic',name:'Epic',weight:7,mult:3.6,color:'var(--c-epic)'},
  {key:'legendary',name:'Legendary',weight:3,mult:5.5,color:'var(--c-legendary)'},
  {key:'mythic',name:'Mythic',weight:1,mult:8.5,color:'var(--c-mythic)'},
];
const RARITY_TOTAL = RARITY.reduce((s,r)=>s+r.weight,0);

const EQUIP_SLOTS = [
  {key:'head',name:'Head',icon:'🪖'},
  {key:'neck',name:'Neck',icon:'📿'},
  {key:'shoulders',name:'Shoulders',icon:'🎽'},
  {key:'chest',name:'Chest',icon:'👕'},
  {key:'back',name:'Back',icon:'🧣'},
  {key:'hands',name:'Hands',icon:'🧤'},
  {key:'waist',name:'Waist',icon:'🎗️'},
  {key:'legs',name:'Legs',icon:'👖'},
  {key:'feet',name:'Feet',icon:'🥾'},
  {key:'mainhand',name:'Main Hand',icon:'⚔️'},
  {key:'offhand',name:'Off Hand',icon:'🛡️'},
  {key:'trinket',name:'Trinket',icon:'💍'},
];

const TRAVEL_LABELS = ['Crawling','Sluggish','Plodding','Unhurried','Steady','Brisk','Swift','Fleet','Blazing','Lightning-quick'];

let _uid = 1;
function uid(prefix){ return prefix + '_' + (_uid++) + '_' + Math.random().toString(36).slice(2,7); }

/* helper to build a 6-entry skill tree: 4 power skills + 2 major-stat skills.
   IDs are DETERMINISTIC (based on ownerId + index) so saved skill levels survive page reloads
   (module-level uid() has a random component and must never be used for skill ids). */
function buildTree(ownerId, powerDefs, statDefs){
  const tree = [];
  powerDefs.forEach((p,i)=>{
    tree.push({
      id: ownerId+'_p'+i, name:p[0], type:p[1], desc:p[2], scalingStat:p[3], base:p[4],
      elem:p[5]||null, level:0, maxLevel:10
    });
  });
  statDefs.forEach((s,i)=>{
    tree.push({
      id: ownerId+'_s'+i, name:s[0], type:'stat', desc:s[1], statKey:s[2], per:s[3],
      level:0, maxLevel:10
    });
  });
  return tree;
}

/* =========================================================
   RACES (12)
   ========================================================= */
function mkRace(name,icon,desc,primary,secondary,resistKey,powerDefs,statDefs,carryBonus,hpPerLevel,mpPerLevel){
  const id = 'race_'+name.toLowerCase();
  return {
    id, name, icon, desc, primary, secondary,
    resist: resistKey, resistAmt: 42,
    bonus: STAT_KEYS.reduce((o,k)=>{ o[k]= k===primary?7:(k===secondary?4:1); return o; },{}),
    carryBonus, hpPerLevel, mpPerLevel, xpMod: 1,
    skills: buildTree(id, powerDefs, statDefs)
  };
}

const RACES = [
  mkRace('Human','🧑','Adaptable wanderers whose willpower bends fate itself.','luck','wis','arcane',
    [['Fated Strike','power','A blow guided by fortune.','luck',9],
     ['Quick Study','power','Rapid focus empowers the next cast.','wis',7],
     ['Silver Tongue','passive','Improves gold earned from all sources.','luck',5],
     ['Second Wind','passive','Chance to shrug off a killing blow.','vit',6]],
    [['Ambition','Raises Luck significantly.','luck',5],
     ['Wanderer\'s Resolve','Raises Wisdom significantly.','wis',5]],
    2,6,4),
  mkRace('Elf','🧝','Graceful forestfolk attuned to wind and starlight.','agi','int','air',
    [['Windblade','power','A gust-quickened slash.','agi',10],
     ['Starfire Bolt','power','A crackling bolt of old magic.','int',11],
     ['Moonlit Step','passive','Improves autocast readiness.','agi',5],
     ['Keen Eye','passive','Improves critical strike chance.','agi',6]],
    [['Grace of the Grove','Raises Agility significantly.','agi',5],
     ['Ancient Insight','Raises Intellect significantly.','int',5]],
    1,5,7),
  mkRace('Dwarf','🧔','Stout mountainfolk, unshaken as the stone they carve.','vit','str','earth',
    [['Stonehammer','power','A crushing, earthen blow.','str',11],
     ['Bedrock Bulwark','passive','Improves defense against physical hits.','vit',7],
     ['Deepforge Grit','passive','Improves resistance to all elements.','vit',5],
     ['Tunnel Rush','power','A charging strike from the dark.','str',9]],
    [['Mountain\'s Heart','Raises Vitality significantly.','vit',6],
     ['Ironclad Might','Raises Strength significantly.','str',5]],
    3,9,2),
  mkRace('Orc','🧌','Fierce warborn whose blood runs hot as flame.','str','vit','fire',
    [['Rage Cleave','power','A furious, burning cleave.','str',12],
     ['Bloodfire','power','Ignites the foe with inner rage.','str',10],
     ['Warcry','passive','Improves damage as health drops.','str',6],
     ['Thick Hide','passive','Improves max health.','vit',6]],
    [['Savage Fury','Raises Strength significantly.','str',6],
     ['Warborn Vigor','Raises Vitality significantly.','vit',5]],
    2,8,2),
  mkRace('Gnome','🧙','Inventive tinkerers who spark lightning from copper coils.','int','luck','lightning',
    [['Spark Jolt','power','A quick electric jab.','int',9],
     ['Overcharge','power','A charged, arcing bolt.','int',12],
     ['Tinker\'s Insight','passive','Improves forge and enchant results.','int',5],
     ['Lucky Gadget','passive','Small chance to double loot.','luck',6]],
    [['Bright Mind','Raises Intellect significantly.','int',6],
     ['Fortunate Spark','Raises Luck significantly.','luck',5]],
    2,4,7),
  mkRace('Halfling','🍀','Easygoing folk who slip through field and thicket unseen.','agi','luck','nature',
    [['Bramblesting','power','A quick, thorned jab.','agi',8],
     ['Lucky Strike','power','A strike aided by sheer luck.','luck',9],
     ['Light Feet','passive','Improves travel speed slightly.','agi',4],
     ['Forager\'s Sense','passive','Improves food/drink effectiveness.','luck',4]],
    [['Nimble Grace','Raises Agility significantly.','agi',5],
     ['Charmed Fortune','Raises Luck significantly.','luck',5]],
    4,5,4),
  mkRace('Dragonborn','🐉','Scaled descendants of wyrms, armored like living metal.','str','int','metal',
    [['Wyrm Claw','power','A metal-hard raking claw.','str',11],
     ['Draconic Breath','power','A scouring elemental breath.','int',12],
     ['Scaled Plating','passive','Improves physical damage reduction.','vit',6],
     ['Ancestral Pride','passive','Improves damage vs bosses.','str',5]],
    [['Draconic Power','Raises Strength significantly.','str',6],
     ['Elder Wisdom','Raises Intellect significantly.','int',5]],
    2,7,5),
  mkRace('Tiefling','😈','Infernal-blooded outcasts wreathed in living shadow.','int','agi','shadow',
    [['Shadow Lash','power','A whip of curling darkness.','int',10],
     ['Hellspark','power','A quick infernal jab.','agi',9],
     ['Umbral Veil','passive','Improves evasion.','agi',5],
     ['Cursed Fortune','passive','Improves rare drop chance.','luck',5]],
    [['Infernal Cunning','Raises Intellect significantly.','int',5],
     ['Shadowstep','Raises Agility significantly.','agi',5]],
    2,5,6),
  mkRace('Aasimar','😇','Celestial-touched souls that carry a sliver of dawnlight.','wis','vit','light',
    [['Radiant Smite','power','A blow wreathed in holy light.','wis',11],
     ['Dawnray','power','A searing beam of light.','wis',10],
     ['Halo Ward','passive','Improves healing received.','wis',5],
     ['Blessed Body','passive','Improves max mana.','wis',5]],
    [['Celestial Grace','Raises Wisdom significantly.','wis',6],
     ['Radiant Vigor','Raises Vitality significantly.','vit',5]],

    thirst:100, hunger:100, mood:70,
    fatigue:30,

    regionId: REGIONS[0].id,
    faction: null, factionContribution:{},   // {factionId: points}
    deity: null, deityFavor:{},              // {deityId: points}
    cultureRep:{},                            // {cultureId: points}
    bags:0,
    equipment: {}, // slotKey -> item
    inventory: [], // items
    autoSell: {common:false,uncommon:false,rare:false,epic:false,legendary:false,mythic:false},

function race(){ return RACES.find(r=>r.id===state.raceId); }
function cls(){ return CLASSES.find(c=>c.id===state.classId); }
function region(){ return REGIONS.find(r=>r.id===state.regionId); }

function allSkills(){
  // returns merged race+class skills with live level from state (stored inline on skill objects, but
  // since RACES/CLASSES are shared singletons we keep per-save levels in state.skillLevels)
  return null;
}

/* Because RACES/CLASSES definitions are shared JS objects, we track skill levels separately per save
   so multiple saves / reloading doesn't corrupt template data. */
function ensureSkillLevels(){
  if(!state.skillLevels) state.skillLevels = {};
  race().skills.forEach(s=>{ if(!(s.id in state.skillLevels)) state.skillLevels[s.id]=0; });
  cls().skills.forEach(s=>{ if(!(s.id in state.skillLevels)) state.skillLevels[s.id]=0; });
}
function skillLevel(skillId){ return state.skillLevels[skillId] || 0; }
function setSkillLevel(skillId, lvl){ state.skillLevels[skillId] = lvl; }

/* ---------------- DERIVED STATS ---------------- */
function baseStats(){
  const r = race(), c = cls();
  const s = {};
  STAT_KEYS.forEach(k=>{
    s[k] = 10 + r.bonus[k] + c.bonus[k] + (state.level-1)*1;
  });
  return s;
}

function equipmentStats(){
  const s = {str:0,agi:0,int:0,vit:0,wis:0,luck:0};
  const resist = {};
  Object.values(state.equipment).forEach(it=>{
    if(!it) return;
    Object.entries(it.stats||{}).forEach(([k,v])=>{ s[k]=(s[k]||0)+v; });
    if(it.resistElement) resist[it.resistElement] = (resist[it.resistElement]||0) + (it.resistAmt||0);
  });
  return {s, resist};
}

function skillStatBonus(){
  const s = {str:0,agi:0,int:0,vit:0,wis:0,luck:0};
  ensureSkillLevels();
  [...race().skills, ...cls().skills].forEach(sk=>{
    if(sk.type==='stat'){
      const lvl = skillLevel(sk.id);
      if(lvl>0) s[sk.statKey] += sk.per*lvl;
    }
  });
  return s;
}

function factionStatBonus(){
  const s = {str:0,agi:0,int:0,vit:0,wis:0,luck:0};
  if(state.faction){
    const f = FACTIONS.find(x=>x.id===state.faction);
    const rank = Math.min(10, state.factionContribution[state.faction]||0);
    if(f) s[f.statKey] += f.perRank*rank;
  }
  return s;
}
function deityStatBonus(){
  const s = {str:0,agi:0,int:0,vit:0,wis:0,luck:0};
  if(state.deity){
    const d = DEITIES.find(x=>x.id===state.deity);
    const rank = Math.min(10, state.deityFavor[state.deity]||0);
    if(d) s[d.statKey] += d.perFavor*rank;
  }
  return s;
}
function cultureStatBonus(){
  const s = {str:0,agi:0,int:0,vit:0,wis:0,luck:0};
  CULTURES.forEach(cu=>{
    const rank = Math.min(10, state.cultureRep[cu.id]||0);
    if(rank>0) s[cu.statKey] += cu.perRep*rank;
  });
  return s;
}

function carryCapacity(){
  return 20 + race().carryBonus + cls().carryBonus + Math.floor(state.level/5) + state.bags;
}

function overCapacity(){ return state.inventory.length >= carryCapacity(); }

function effectiveStats(){
  const b = baseStats();
  const eq = equipmentStats();
  const sk = skillStatBonus();
  const fa = factionStatBonus();
  const de = deityStatBonus();
  const cu = cultureStatBonus();
  const out = {};
  const perm = state.permStatBonus || {};
  STAT_KEYS.forEach(k=>{
    let v = b[k] + eq.s[k] + sk[k] + fa[k] + de[k] + cu[k] + (perm[k]||0);
    out[k]=v;
  });
  if(overCapacity()){
    out.str = Math.round(out.str*0.92); out.agi = Math.round(out.agi*0.92);
    out.int = Math.round(out.int*0.92); out.wis = Math.round(out.wis*0.92);
  }
  return out;
}

function elementResistances(){
  const res = {};
  ELEMENTS.forEach(e=>res[e.key]=0);
  res[race().resist] += race().resistAmt;
  CULTURES.forEach(cu=>{
    const rank = Math.min(10, state.cultureRep[cu.id]||0);
    if(rank>0) res[cu.element] += rank*4;
  });
  const eq = equipmentStats();
  Object.entries(eq.resist).forEach(([k,v])=>{ res[k]=(res[k]||0)+v; });
  return res;
}

function maxHP(){
  const st = effectiveStats();
  const factionRank = state.faction ? Math.min(10, state.factionContribution[state.faction]||0) : 0;
  let hp = 50 + st.vit*7 + (race().hpPerLevel + cls().hpPerLevel + factionRank*2) * state.level;
  if(state.hunger < 20) hp = Math.round(hp*0.72);
  return Math.max(20, Math.round(hp));
}
function maxMP(){
  const st = effectiveStats();
  const favor = state.deity ? Math.min(10, state.deityFavor[state.deity]||0) : 0;
  let mp = 20 + st.int*3 + st.wis*2 + (race().mpPerLevel + cls().mpPerLevel + favor*2) * state.level;
  if(state.thirst < 20) mp = Math.round(mp*0.72);
  return Math.max(10, Math.round(mp));
}
function xpToNext(){ return Math.round(45 * Math.pow(state.level,1.55) + 30); }
function moodXpMult(){ return 0.7 + (state.mood/100)*0.6; }
function xpMult(){
  let cultureBonus = 0;
  CULTURES.forEach(cu=>{ cultureBonus += Math.min(10,state.cultureRep[cu.id]||0)*0.01; });
  return moodXpMult() * (1+cultureBonus) * race().xpMod * cls().xpMod;
}

function travelSpeed(){
  let sp = cls().travelSpeed;
  if(state.hasMount) sp += 3;
  ensureSkillLevels();
  cls().skills.forEach(s=>{
    if(cls().hasTravelSkill && s.type==='passive'){
      sp += skillLevel(s.id)*0.3;
    }
  });
  race().skills.forEach(s=>{
    if(/step|feet/i.test(s.name) && s.type==='passive') sp += skillLevel(s.id)*0.2;
  });
  return Math.max(1, Math.min(10, sp));
}
function travelLabel(){ return TRAVEL_LABELS[Math.round(travelSpeed())-1] || TRAVEL_LABELS[4]; }
function encounterSeconds(){
  const sp = travelSpeed();
  return Math.round(Math.max(10, Math.min(90, 90 - (sp-1)*(80/9))));
}
function autocastSeconds(){
  return +(8 + (state.fatigue/100)*4).toFixed(1);
}

  let r = Math.random()*RARITY_TOTAL;
  for(const rar of RARITY){ if(r<rar.weight) return rar; r-=rar.weight; }
  return RARITY[0];
}
function randStat(){ return STAT_KEYS[Math.floor(Math.random()*STAT_KEYS.length)]; }
function generateItem(level, forcedRarity){
  const slot = EQUIP_SLOTS[Math.floor(Math.random()*EQUIP_SLOTS.length)];
  const rarity = forcedRarity || rollRarity();
  const nounList = ITEM_NOUNS[slot.key];
  const noun = nounList[Math.floor(Math.random()*nounList.length)];
  const adj = ITEM_ADJ[Math.floor(Math.random()*ITEM_ADJ.length)];
  const rIdx = RARITY.findIndex(r=>r.key===rarity.key);
  const numStats = Math.min(4, 1+rIdx);
  const stats = {};
  const usedStats = new Set();
  for(let i=0;i<numStats;i++){
    let k = randStat();
    let tries=0; while(usedStats.has(k) && tries<8){ k=randStat(); tries++; }
    usedStats.add(k);
    const power = Math.round((1 + level*0.6) * rarity.mult * (0.6+Math.random()*0.8));
    stats[k] = (stats[k]||0) + Math.max(1,power);
  }
  const value = Math.round((5 + level*2) * rarity.mult);
  return {
    id: uid('it'), name:`${adj} ${noun}`, slot: slot.key, slotIcon: slot.icon,
    rarity: rarity.key, stats, value, resistElement:null, resistAmt:0, level
  };
}
function generateEssence(elementKey){
  const el = EL[elementKey];
  return { id: uid('es'), name:`${el.name} Boss Essence`, slot:null, isEssence:true, element:elementKey, value: 40 };
}
function rarityDef(key){ return RARITY.find(r=>r.key===key); }

/* =========================================================
   LOG / COMBAT / GAME LOOP
   ========================================================= */
function log(msg, cls){
  state.log.unshift({msg, cls: cls||'log-info', t: Date.now()});
  if(state.log.length>80) state.log.length = 80;
  renderBattleLog();
}

function currentAttackPool(){
  ensureSkillLevels();
  const pool = [];
  race().skills.forEach(s=>{ if(s.type==='power' && skillLevel(s.id)>0) pool.push({skill:s, source:'race'}); });
  cls().skills.forEach(s=>{ if((s.type==='attack'||s.type==='spell') && skillLevel(s.id)>0) pool.push({skill:s, source:'class'}); });
  return pool;
}

function pickMonster(){
  const reg = region();
  const m = reg.monsters[Math.floor(Math.random()*reg.monsters.length)];
  const lvl = Math.max(1, state.level + Math.floor(Math.random()*3) - 1);
  const hp = Math.round((18 + lvl*9) * (1+ (reg.minLevel*0.03)));
  return {
    name:m.name, element:m.element, level:lvl, hp, maxHp:hp,
    atk: Math.round(4 + lvl*2.1), isBoss:false
  };
}
function pickBoss(){
  const reg = region();
  const lvl = state.level+2;
  const hp = Math.round((18+lvl*9) * reg.boss.hpMult * 0.4);
  return { name:reg.boss.name, element:reg.boss.element, level:lvl, hp, maxHp:hp, atk: Math.round(6+lvl*2.6), isBoss:true, essenceDropChance:reg.boss.essenceDropChance };
}

function playerDamageTo(monsterElement){
  const st = effectiveStats();
  const pool = currentAttackPool();
  if(pool.length===0){
    return {dmg: Math.max(1, Math.round(st.str*0.4)), name:'Basic Strike'};
  }
  const pick = pool[Math.floor(Math.random()*pool.length)];
  const sk = pick.skill;
  const lvl = skillLevel(sk.id);
  const statVal = st[sk.scalingStat] || st.str;
  let dmg = Math.round((sk.base + statVal*0.9) * (1 + lvl*0.18));
  const crit = Math.random() < Math.min(0.4, 0.05 + st.luck*0.003);
  if(crit) dmg = Math.round(dmg*1.8);
  return {dmg, name:sk.name, crit};
}

function monsterDamageTo(monster){
  const res = elementResistances();
  const st = effectiveStats();
  let dmg = monster.atk + Math.floor(Math.random()*4);
  const resistPct = Math.min(70, (res[monster.element]||0)) / 100;
  dmg = Math.round(dmg * (1-resistPct));
  const defReduce = Math.min(0.5, st.vit*0.004);
  dmg = Math.max(1, Math.round(dmg*(1-defReduce)));
  return dmg;
}

function spawnEncounter(){
  const reg = region();
  const isBossFight = Math.random() < 0.08;
  state.monster = isBossFight ? pickBoss() : pickMonster();
  log(`${state.monster.isBoss?'⚠️ A region boss appears':'A wild foe appears'}: ${state.monster.name} (Lv.${state.monster.level})`, 'log-info');
}

function grantXP(amount){
  state.xp += Math.round(amount * xpMult());
  while(state.xp >= xpToNext()){
    state.xp -= xpToNext();
    state.level++;
    state.skillPoints++;
    state.mp = maxMP(); state.hp = maxHP();
    log(`✦ Level up! You are now level ${state.level}.`, 'log-lvl');
  }
}

function killMonster(){
  const m = state.monster;
  state.totalKills++;
  const goldGain = Math.round((3 + m.level*1.8) * (m.isBoss?4:1));
  state.gold += goldGain;
  grantXP(Math.round((8 + m.level*4) * (m.isBoss?3:1)));
  log(`You defeat ${m.name}! +${goldGain}g`, 'log-info');

  // loot roll
  const dropChance = m.isBoss ? 1 : 0.55;
  if(Math.random() < dropChance){
    const forced = m.isBoss ? RARITY[Math.min(RARITY.length-1, 1+Math.floor(Math.random()*3))] : null;
    const item = generateItem(m.level, forced);
    handleLoot(item);
  }
  if(m.isBoss && Math.random() < m.essenceDropChance){
    const es = generateEssence(m.element);
    state.essences[m.element] = (state.essences[m.element]||0)+1;
    log(`Boss drop! ${es.name} obtained.`, 'log-loot');
  }
  if(m.isBoss && Math.random()<0.5){
    state.mood = Math.min(100, state.mood+6);
  }
  state.stamina = Math.max(0, state.stamina - (m.isBoss?16:8));
  state.fatigue = Math.min(100, state.fatigue + (m.isBoss?10:5));
  // rare "Bag" consumable drop - permanently raises carry capacity by 1
  const bagChance = m.isBoss ? 0.02 : 0.004;
  if(Math.random() < bagChance){
    state.bags += 1;
    log(`✨ A rare Bag was found! Max carry capacity permanently increased.`, 'log-crit');
  }
  state.monster = null;
  state.encounterTimer = encounterSeconds();
}

function handleLoot(item){
  const rar = rarityDef(item.rarity);
  if(state.autoSell[item.rarity]){
    state.gold += item.value;
    log(`Auto-sold ${item.name} (${rar.name}) for ${item.value}g`, 'log-loot');
    return;
  }
  if(overCapacity()){
    log(`Inventory full — ${item.name} was lost! (raise carry capacity)`, 'log-dmg');
    return;
  }
  state.inventory.push(item);
  log(`Loot: ${item.name} [${rar.name}]`, item.rarity==='mythic'||item.rarity==='legendary' ? 'log-crit' : 'log-loot');
  if(item.rarity==='legendary'||item.rarity==='mythic') state.mood = Math.min(100, state.mood+8);
}

function playerDefeated(){
  state.deaths++;
  const lost = Math.min(state.gold, Math.round(state.gold*0.08));
  state.gold -= lost;
  log(`You were defeated and stagger back to town, dropping ${lost}g...`, 'log-dmg');
  state.hp = Math.max(1, Math.round(maxHP()*0.4));
  state.monster = null;
  state.encounterTimer = encounterSeconds()+10;
}

/* main tick: called once per simulated second */
function tick(){
  if(state.paused) return;
  ensureSkillLevels();
  state.dayTick++;
  // day/night & season cycle: 240 ticks = 1 day, 12 days = 1 season
  const dayLen = 240;
  const dayPos = state.dayTick % dayLen;
  const phases = ['Dawn','Morning','Midday','Afternoon','Dusk','Night'];
  state.timeOfDay = phases[Math.floor(dayPos/(dayLen/phases.length))];
  const seasons = ['Spring','Summer','Autumn','Winter'];
  state.season = seasons[Math.floor(state.dayTick/(dayLen*12)) % 4];

  // needs decay
  if(state.dayTick % 6 === 0){
    state.thirst = Math.max(0, state.thirst-1);
    state.hunger = Math.max(0, state.hunger-1);
    state.mood = Math.max(0, state.mood-0.4);
    state.fatigue = Math.max(0, state.fatigue-0.6);
  }

  state.hp = Math.min(state.hp, maxHP());
  state.mp = Math.min(state.mp, maxMP());
  if(state.hp<=0) state.hp = 1;

  if(state.stamina <= 0){
    return; // must rest at inn
  }

  if(!state.monster){
    state.encounterTimer -= 1;
    if(state.encounterTimer <= 0){
      spawnEncounter();
      state.autocastTimer = autocastSeconds();
    }
    return;
  }

  // in combat
  state.autocastTimer -= 1;
  if(state.autocastTimer <= 0){
    const atk = playerDamageTo(state.monster.element);
    state.monster.hp -= atk.dmg;
    log(`${atk.crit?'CRIT! ':''}You use ${atk.name} for ${atk.dmg} dmg`, atk.crit?'log-crit':'log-dmg');
    if(state.monster.hp <= 0){
      killMonster();
      return;
    }
    const mdmg = monsterDamageTo(state.monster);
    state.hp -= mdmg;
    log(`${state.monster.name} hits you for ${mdmg} dmg`, 'log-dmg');
    state.autocastTimer = autocastSeconds();
    if(state.hp <= 0){
      playerDefeated();
    }
  }
}

function gameLoop(){
  if(!state) return;
  for(let i=0;i<gameSpeed;i++) tick();
  renderHUD();
  renderCombatPanel();
  if(document.getElementById('panel-inventory').classList.contains('active')) {} // stats live already reflected via HUD
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */
function storageAvailable(){ return typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function'; }
async function saveGame(){
  if(!state || !storageAvailable()) return;
  try{
    await window.storage.set('vibequestidle_save', JSON.stringify(state), false);
  }catch(e){ console.error('save failed', e); }
}
async function loadGame(){
  if(!storageAvailable()) return false;
  try{
    const res = await window.storage.get('vibequestidle_save', false);
    if(res && res.value){
      state = JSON.parse(res.value);
      return true;
    }
  }catch(e){ /* no save yet */ }
  return false;
}
function scheduleAutosave(){
  if(saveTimer) clearInterval(saveTimer);
  saveTimer = setInterval(saveGame, 12000);
}

/* =========================================================
   SKILLS PANEL
   ========================================================= */
function renderSkillTree(container, owner, treeName){
  const html = owner.skills.map(sk=>{
    const lvl = skillLevel(sk.id);
    const canLevel = lvl < sk.maxLevel && state.skillPoints > 0;
    const dots = Array.from({length:sk.maxLevel}, (_,i)=>`<span class="dot ${i<lvl?'lit':''}"></span>`).join('');
    let typeLabel = sk.type==='stat' ? `+${STAT_LABEL[sk.statKey]}` : (sk.type[0].toUpperCase()+sk.type.slice(1));
    return `<div class="skill-card">
      <div class="skill-head"><span class="skill-name">${sk.name}</span><span class="skill-lvl">Lv ${lvl}/${sk.maxLevel}</span></div>
      <div class="skill-desc">${sk.desc} <span style="color:var(--gold-dim)">[${typeLabel}]</span></div>
      <div class="skill-dots">${dots}</div>
      <button data-skill="${sk.id}" ${canLevel?'':'disabled'}>Level Up (1 pt)</button>
    </div>`;
  }).join('');
  container.innerHTML = html;
  container.querySelectorAll('button[data-skill]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.skill;
      if(state.skillPoints<=0) return;
      const cur = skillLevel(id);
      const allS = [...race().skills, ...cls().skills];
      const sk = allS.find(s=>s.id===id);
      if(cur>=sk.maxLevel) return;
      setSkillLevel(id, cur+1);
      state.skillPoints--;
      renderSkillsPanel();
      renderHUD();
    });
  });
}
function renderSkillsPanel(){
  const p = document.getElementById('panel-skills');
  p.innerHTML = `
    <h2 class="section-title">Skills</h2>
    <div class="banner info">Skill points available: <b>${state.skillPoints}</b> — earned 1 per level. Class skills and racial powers autocast automatically in combat once leveled to 1.</div>
    <div class="sub-title" style="margin-top:0;">${cls().icon} ${cls().name} Skill Tree</div>
    <div class="grid grid-3" id="classTree"></div>
    <div class="sub-title">${race().icon} ${race().name} Racial Powers</div>
    <div class="grid grid-3" id="raceTree"></div>
  `;
  renderSkillTree(document.getElementById('classTree'), cls());
  renderSkillTree(document.getElementById('raceTree'), race());
}

/* =========================================================
   INVENTORY PANEL
   ========================================================= */
function itemStatsStr(it){
  if(it.isEssence) return `Forge material · tied to ${EL[it.element].name}`;
  const parts = Object.entries(it.stats||{}).map(([k,v])=>`+${v} ${STAT_LABEL[k]}`);
  if(it.resistElement) parts.push(`+${it.resistAmt} ${EL[it.resistElement].name} resist`);
  return parts.join(', ');
}
function equipItem(itemId){
  const idx = state.inventory.findIndex(i=>i.id===itemId);
  if(idx<0) return;
  const item = state.inventory[idx];
  if(!item.slot) return;
  const prev = state.equipment[item.slot];
  state.equipment[item.slot] = item;
  state.inventory.splice(idx,1);
  if(prev) state.inventory.push(prev);
  log(`Equipped ${item.name}.`, 'log-info');
  renderInventoryPanel(); renderHUD();
}
function unequipItem(slotKey){
  const item = state.equipment[slotKey];
  if(!item) return;
  if(overCapacity()){ log('Cannot unequip — inventory is full.', 'log-dmg'); return; }
  state.equipment[slotKey] = null;
  state.inventory.push(item);
  renderInventoryPanel(); renderHUD();
}
function sellItem(itemId){
  const idx = state.inventory.findIndex(i=>i.id===itemId);
  if(idx<0) return;
  const item = state.inventory[idx];
  state.gold += item.value;
  state.inventory.splice(idx,1);
  log(`Sold ${item.name} for ${item.value}g.`, 'log-info');
  renderInventoryPanel(); renderHUD();
}
function scrapItem(itemId){
  const idx = state.inventory.findIndex(i=>i.id===itemId);
  if(idx<0) return;
  const item = state.inventory[idx];
  const rIdx = RARITY.findIndex(r=>r.key===item.rarity);
  const dust = 1 + rIdx;
  state.scrapDust += dust;
  state.inventory.splice(idx,1);
  log(`Scrapped ${item.name} for ${dust} Scrap Dust.`, 'log-info');
  renderInventoryPanel();
}

function useDust(statKey){
  if(state.scrapDust<=0) return;
  state.scrapDust--;
  const eff = state.permStatBonus || (state.permStatBonus={});
  eff[statKey] = (eff[statKey]||0)+1;
  log(`Used Scrap Dust to permanently gain +1 ${STAT_LABEL[statKey]}.`, 'log-info');
  renderForgePanel();
}
function findAnyItem(itemId){
  const eq = Object.values(state.equipment).find(i=>i && i.id===itemId);
  if(eq) return eq;
  return state.inventory.find(i=>i.id===itemId);
}
function enchantItem(itemId, elementKey){
  const count = state.essences[elementKey]||0;
  if(count<=0) return;
  const it = findAnyItem(itemId);
  if(!it) return;
  state.essences[elementKey] = count-1;
  it.resistElement = elementKey;
  it.resistAmt = (it.resistAmt||0) + 6;
  const bonusStat = randStat();
  it.stats[bonusStat] = (it.stats[bonusStat]||0) + 2;
  log(`Enchanted ${it.name} with ${EL[elementKey].name} essence: +6 resist, +2 ${STAT_LABEL[bonusStat]}.`, 'log-loot');
  renderForgePanel(); renderInventoryPanel(); renderHUD();
}

      </div>
    </div>
  `;

function joinFaction(id){
  if(state.faction === id) return;
  if(state.faction){
    const cur = state.factionContribution[state.faction]||0;
    state.factionContribution[state.faction] = Math.max(0, cur-2);
  }
  state.faction = id;
  if(!(id in state.factionContribution)) state.factionContribution[id]=0;
  log(`You now represent the ${FACTIONS.find(f=>f.id===id).name}.`, 'log-info');
  renderFactionsPanel(); renderHUD();
}
function contributeFaction(id, amt){
  if(state.gold < amt) return;
  state.gold -= amt;
  state.factionContribution[id] = Math.min(10, (state.factionContribution[id]||0) + 1);
  renderFactionsPanel(); renderHUD();
}
function factionTitle(f, rank){ return `${RANK_TITLES[Math.max(0,rank-1)]||'Recruit'} of the ${f.name}`; }

   ========================================================= */
const FOOD_ITEMS = [
  {name:'Bread & Cheese', cost:8, hunger:30, mood:2},
  {name:'Roast Meat', cost:20, hunger:55, mood:4},
  {name:'Feast Platter', cost:55, hunger:100, mood:10},
];
const DRINK_ITEMS = [
  {name:'Water Skin', cost:5, thirst:30, mood:1},
  {name:'Spiced Cider', cost:15, thirst:55, mood:4},
  {name:'Elixir Draught', cost:40, thirst:100, mood:8},
];
const MOUNT_COST = 4500;

function restAtInn(){
  const cost = 10;
  if(state.gold < cost) { log('Not enough gold to rest at the inn.', 'log-dmg'); return; }
  state.gold -= cost;
  state.stamina = 100;
  state.fatigue = Math.max(0, state.fatigue-40);
  state.mood = Math.min(100, state.mood+10);
  state.hp = maxHP(); state.mp = maxMP();
  log('You rest at the inn and recover fully.', 'log-lvl');
  renderTownPanel(); renderHUD();
}
function buyMount(){
  if(state.gold < MOUNT_COST || state.hasMount) return;
  state.gold -= MOUNT_COST;
  state.hasMount = true;
  log('You purchase a mount! Travel speed increased.', 'log-lvl');
  renderTownPanel(); renderHUD();
}
function buyFood(idx){
  const f = FOOD_ITEMS[idx];
  if(state.gold < f.cost) return;
  state.gold -= f.cost;
  state.hunger = Math.min(100, state.hunger+f.hunger);
  state.mood = Math.min(100, state.mood+f.mood);
  log(`You eat ${f.name}.`, 'log-info');
  renderTownPanel(); renderHUD();
}
function buyDrink(idx){
  const d = DRINK_ITEMS[idx];
  if(state.gold < d.cost) return;
  state.gold -= d.cost;
  state.thirst = Math.min(100, state.thirst+d.thirst);
  state.mood = Math.min(100, state.mood+d.mood);
  log(`You drink ${d.name}.`, 'log-info');
  renderTownPanel(); renderHUD();
}
function renderTownPanel(){
  const p = document.getElementById('panel-town');
  p.innerHTML = `<h2 class="section-title">Town</h2>
  <div class="grid grid-3">
    <div class="card">
      <div class="sub-title" style="margin-top:0;">🛏️ Inn</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:8px;">Rest to fully restore stamina, HP, MP and ease fatigue.</div>
      <button class="primary" id="restBtn">Rest (10g)</button>
    </div>
    <div class="card">
      <div class="sub-title" style="margin-top:0;">🐴 Stable</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:8px;">${state.hasMount? 'You already own a mount.' : `Purchase a mount to boost travel speed (classes without a starting mount must buy one).`}</div>
      <button id="mountBtn" ${state.hasMount||state.gold<MOUNT_COST?'disabled':''}>${state.hasMount?'Owned':'Buy Mount ('+MOUNT_COST+'g)'}</button>
    </div>
    <div class="card">
      <div class="sub-title" style="margin-top:0;">🎒 Bags</div>
      <div style="font-size:14px;color:var(--muted);">Rare consumables found in the wild permanently raise carry capacity by 1. You've found <b style="color:var(--gold)">${state.bags}</b> so far.</div>
    </div>
  </div>
  <div class="sub-title">🍞 Food Stall</div>
  <div class="grid grid-3">
    ${FOOD_ITEMS.map((f,i)=>`<div class="card"><div class="stat-row"><span>${f.name}</span><b>${f.cost}g</b></div><div style="font-size:13px;color:var(--muted);">+${f.hunger} hunger, +${f.mood} mood</div><button data-food="${i}" ${state.gold<f.cost?'disabled':''}>Buy & Eat</button></div>`).join('')}
  </div>
  <div class="sub-title">🍺 Tavern</div>
  <div class="grid grid-3">
    ${DRINK_ITEMS.map((d,i)=>`<div class="card"><div class="stat-row"><span>${d.name}</span><b>${d.cost}g</b></div><div style="font-size:13px;color:var(--muted);">+${d.thirst} thirst, +${d.mood} mood</div><button data-drink="${i}" ${state.gold<d.cost?'disabled':''}>Buy & Drink</button></div>`).join('')}
  </div>`;
  document.getElementById('restBtn').addEventListener('click', restAtInn);
  document.getElementById('mountBtn').addEventListener('click', buyMount);
  p.querySelectorAll('[data-food]').forEach(b=>b.addEventListener('click', ()=>buyFood(+b.dataset.food)));
  p.querySelectorAll('[data-drink]').forEach(b=>b.addEventListener('click', ()=>buyDrink(+b.dataset.drink)));
}

/* =========================================================
   BOOT
   ========================================================= */
(async function boot(){
  const hasSave = await loadGame();
  if(hasSave && state){
    ensureSkillLevels();
    document.getElementById('charCreate').style.display = 'none';
    startApp();
    log('Welcome back! Your progress was restored.', 'log-info');
  } else {
    renderCharCreate();
  }
})();

})(); // end IIFE
</script>
</body>
</html>
