/* =========================================================
   COW DIMENSION — minigame gate, final boss, reincarnation
   ========================================================= */
let moo = null; // transient minigame state
function startMooGame(){
  moo = { round:1, successes:0, pos:0, dir:1, zoneStart: 30+Math.random()*20, zoneWidth: 18, timerId:null, resultMsg:'', active:true };
  renderCowPanel();
  moo.timerId = setInterval(mooTick, 35);
}
function mooTick(){
  if(!moo || !moo.active) return;
  moo.pos += moo.dir * (2.2 + moo.round*0.25);
  if(moo.pos>=100){ moo.pos=100; moo.dir=-1; }
  if(moo.pos<=0){ moo.pos=0; moo.dir=1; }
  const cursor = document.getElementById('mooCursor');
  if(cursor) cursor.style.left = moo.pos+'%';
  else { clearInterval(moo.timerId); }
}
function mooStop(){
  if(!moo || !moo.active) return;
  const inZone = moo.pos >= moo.zoneStart && moo.pos <= moo.zoneStart+moo.zoneWidth;
  if(inZone) moo.successes++;
  moo.round++;
  if(moo.round > 5){
    moo.active = false;
    clearInterval(moo.timerId);
    if(moo.successes >= 3){
      state.cowMinigamePassed = true;
      moo.resultMsg = `Success! ${moo.successes}/5 — the way to the Cow is open.`;
      log('🐄 You pass the herding trial. The Cow awaits.', 'log-lvl');
    } else {
      moo.resultMsg = `Not quite — ${moo.successes}/5. The herd scatters. Try again.`;
    }
    renderCowPanel();
    return;
  }
  moo.zoneStart = 20+Math.random()*40;
  moo.zoneWidth = Math.max(10, 18-moo.round);
  renderCowPanel();
  moo.timerId = setInterval(mooTick, 35);
}

function challengeCow(){
  const lvl = Math.max(30, state.level*2);
  const hp = Math.round(monsterBaseHP(lvl) * 15) + 4000;
  state.monster = { name:'The Cow', element:'nature', level:lvl, hp, maxHp:hp,
    atk: Math.round(8+lvl*1.4), isBoss:true, isCow:true, essenceDropChance:0, rarityFloor:3 };
  state.encounterTimer = 0;
  state.autocastTimer = autocastSeconds();
  log('🐄 The Cow stares at you, unimpressed. The final battle begins.', 'log-boss');
  switchTab('adventure');
}

function reincarnate(){
  const st = effectiveStats();
  const bonus = {};
  STAT_KEYS.forEach(k=>{ bonus[k] = Math.max(1, Math.round(st[k]*0.01)); });
  pendingReincarnate = { bonus, count: (state.reincarnations||0)+1 };
  document.getElementById('app').classList.remove('ready');
  document.getElementById('charCreate').style.display = 'block';
  selRace = null; selClass = null;
  renderCharCreate();
}

function renderCowPanel(){
  const p = document.getElementById('panel-cow');
  if(!allRegionsCompleted()){
    p.innerHTML = `<h2 class="section-title">Cow Dimension</h2>
      <div class="banner warn">This rift only opens once all 12 regions have been conquered (all 3 bosses defeated in each). Progress: ${completedRegionsCount()}/12 regions completed.</div>`;
    return;
  }
  if(state.cowFinalBossDefeated){
    p.innerHTML = `<h2 class="section-title">Cow Dimension</h2>
      <div class="banner gold">The Cow has fallen. Its power is spent... but the world can begin again.</div>
      <div class="card">
        <div class="sub-title" style="margin-top:0;">Reincarnate</div>
        <div style="font-size:17px;color:var(--muted);margin-bottom:10px;">Starting over resets your level, gear, and progress — but grants your new character a permanent echo (1% of your final stats) that carries forward forever.</div>
        <button class="primary" id="reincBtn">✨ Reincarnate</button>
      </div>`;
    document.getElementById('reincBtn').addEventListener('click', reincarnate);
    return;
  }
  if(!state.cowMinigamePassed){
    p.innerHTML = `<h2 class="section-title">Cow Dimension</h2>
      <div class="banner info">All regions conquered! Before you may challenge the final boss, prove yourself in the herding trial: stop the marker inside the green zone at least 3 of 5 times.</div>
      <div class="card" id="mooCard">
        ${moo && moo.active ? `
          <div>Round ${moo.round}/5 · Successes: ${moo.successes}</div>
          <div class="moo-track"><div class="moo-zone" style="left:${moo.zoneStart}%;width:${moo.zoneWidth}%;"></div><div class="moo-cursor" id="mooCursor" style="left:${moo.pos}%;"></div></div>
          <button class="primary" id="mooStopBtn">🛑 Stop!</button>
        ` : `
          ${moo && moo.resultMsg ? `<div class="banner ${state.cowMinigamePassed?'gold':'warn'}">${moo.resultMsg}</div>` : ''}
          <button class="primary" id="mooStartBtn">Begin Herding Trial</button>
        `}
      </div>`;
    const startBtn = document.getElementById('mooStartBtn'); if(startBtn) startBtn.addEventListener('click', startMooGame);
    const stopBtn = document.getElementById('mooStopBtn'); if(stopBtn) stopBtn.addEventListener('click', mooStop);
    return;
  }
  p.innerHTML = `<h2 class="section-title">Cow Dimension</h2>
    <div class="banner gold">The trial is passed. Somewhere in the white void ahead, The Cow is waiting.</div>
    <div class="card">
      <div class="sub-title" style="margin-top:0;">🐄 The Cow</div>
      <div style="font-size:17px;color:var(--muted);margin-bottom:10px;">An entirely ordinary-looking cow with statistics that should not be possible. Idle combat rules apply as normal — it will simply take a while.</div>
      <button class="primary" id="challengeBtn" ${state.monster && state.monster.isCow ? 'disabled':''}>${state.monster && state.monster.isCow ? 'Battle in progress — see Adventure tab' : 'Challenge the Cow'}</button>
    </div>`;
  const cb = document.getElementById('challengeBtn'); if(cb) cb.addEventListener('click', challengeCow);
}

/* =========================================================
   TEXT SIZE CONTROL (top-right, independent of game state/save)
   ========================================================= */
const TEXT_SCALE_KEY = 'vibequestidle_textscale';
const TEXT_SCALE_MIN = 70, TEXT_SCALE_MAX = 160, TEXT_SCALE_STEP = 10;
let textScale = 100;
function applyTextScale(){
  const app = document.getElementById('app');
  const cc = document.getElementById('charCreate');
  const z = textScale/100;
  if(app) app.style.zoom = z;
  if(cc) cc.style.zoom = z;
  const label = document.getElementById('textScaleLabel');
  if(label) label.textContent = textScale+'%';
  const downBtn = document.getElementById('textScaleDown');
  const upBtn = document.getElementById('textScaleUp');
  if(downBtn) downBtn.disabled = textScale<=TEXT_SCALE_MIN;
  if(upBtn) upBtn.disabled = textScale>=TEXT_SCALE_MAX;
}
function changeTextScale(delta){
  textScale = Math.max(TEXT_SCALE_MIN, Math.min(TEXT_SCALE_MAX, textScale+delta));
  try{ if(localStorageAvailable()) window.localStorage.setItem(TEXT_SCALE_KEY, String(textScale)); }catch(e){ /* ignore */ }
  applyTextScale();
}
function initTextScaleControl(){
  try{
    if(localStorageAvailable()){
      const saved = window.localStorage.getItem(TEXT_SCALE_KEY);
      if(saved) textScale = Math.max(TEXT_SCALE_MIN, Math.min(TEXT_SCALE_MAX, parseInt(saved,10)||100));
    }
  }catch(e){ /* ignore */ }
  applyTextScale();
  const downBtn = document.getElementById('textScaleDown');
  const upBtn = document.getElementById('textScaleUp');
  if(downBtn) downBtn.addEventListener('click', ()=>changeTextScale(-TEXT_SCALE_STEP));
  if(upBtn) upBtn.addEventListener('click', ()=>changeTextScale(TEXT_SCALE_STEP));
}
initTextScaleControl();

/* =========================================================
   BOOT
   ========================================================= */
(async function boot(){
  const hasSave = await loadGame();
  if(hasSave && state){
    ensureSkillLevels();
    if(!state.autoBuy) state.autoBuy = {food:false,drink:false,mood:false};
    if(!state.regionProgress) state.regionProgress = {};
    REGIONS.forEach(r=>{
      const p = state.regionProgress[r.id];
      if(!p || !Array.isArray(p.bossesKilled) || p.bossesKilled.length!==3){
        // guard against malformed/legacy save data so a short array can't
        // make Array.prototype.every() report a region "conquered" too early
        const prevKills = (p && Array.isArray(p.bossesKilled)) ? p.bossesKilled : [];
        const fixedKills = [!!prevKills[0], !!prevKills[1], !!prevKills[2]];
        state.regionProgress[r.id] = { bossesKilled: fixedKills, completed: fixedKills.every(Boolean) };
      }
    });
    document.getElementById('charCreate').style.display = 'none';
    startApp();
    log('Welcome back! Your progress was restored.', 'log-info');
  } else {
    renderCharCreate();
  }
})();

})(); // end IIFE
</script>
